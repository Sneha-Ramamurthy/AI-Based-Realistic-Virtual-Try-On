version: '3.9'

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /workspace/services/api
    ports:
      - "8000:8000"
    volumes:
      - ../..:/workspace
    environment:
      PYTHONPATH: /workspace/services/api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
